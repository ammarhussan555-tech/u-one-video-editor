name: Startup Test Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build diagnostic test
      run: |
        pyinstaller --noconfirm --clean --distpath "dist-test" "build/windows/final_test.spec"
        
    - name: Create test ZIP
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "Output"
        Compress-Archive -Path "dist-test/UOneFinal/*" -DestinationPath "Output/UOneFinal.zip" -Force
        
    - name: Upload test ZIP
      uses: actions/upload-artifact@v4
      with:
        name: UOneFinal
        path: Output/UOneFinal.zip
        
    - name: Run diagnostic on Windows (offscreen)
      shell: pwsh
      run: |
        $env:QT_QPA_PLATFORM = "offscreen"
        $proc = Start-Process -FilePath "dist-test/UOneFinal/UOneFinal.exe" -PassThru -NoNewWindow -RedirectStandardOutput "diag_out.txt" -RedirectStandardError "diag_err.txt"
        $exited = $proc.WaitForExit(30000)
        if (-not $exited) {
          Write-Host "DIAG RESULT: app hung (did not exit in 30s) - killing"
          $proc.Kill()
        } else {
          Write-Host "DIAG RESULT: app exited with code $($proc.ExitCode)"
        }
        Write-Host "=== STDOUT ==="
        Get-Content "diag_out.txt" -ErrorAction SilentlyContinue
        Write-Host "=== STDERR ==="
        Get-Content "diag_err.txt" -ErrorAction SilentlyContinue
