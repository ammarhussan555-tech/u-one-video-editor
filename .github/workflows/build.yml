name: Build U One Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Download FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-dl"
        $ffmpegDir = Get-ChildItem -Path "ffmpeg-dl" -Directory | Select-Object -First 1
        New-Item -ItemType Directory -Force -Path "build/windows/ffmpeg"
        Copy-Item "$($ffmpegDir.FullName)/bin/ffmpeg.exe" -Destination "build/windows/ffmpeg/"
        Copy-Item "$($ffmpegDir.FullName)/bin/ffprobe.exe" -Destination "build/windows/ffmpeg/"
        Get-ChildItem "build/windows/ffmpeg/"
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --clean --distpath "dist" --workpath "build/pyinstaller-work" "build/windows/u_one.spec"
        dir "dist"
        
    - name: Verify Qt plugins (critical for GUI startup)
      shell: pwsh
      run: |
        $qwindows = "dist/U One/_internal/PySide6/plugins/platforms/qwindows.dll"
        if (Test-Path $qwindows) {
          Write-Host "OK: qwindows.dll found"
        } else {
          Write-Host "MISSING: qwindows.dll - copying from PySide6..."
          $src = python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'plugins'))"
          Write-Host "PySide6 plugins at: $src"
          Copy-Item "$src/*" -Destination "dist/U One/_internal/PySide6/plugins/" -Recurse -Force
        }
        Get-ChildItem "dist/U One/_internal/PySide6/plugins/platforms/"
        
    - name: Create portable ZIP (backup)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "Output"
        Compress-Archive -Path "dist/U One/*" -DestinationPath "Output/U_One_Portable.zip" -Force
        dir Output/
        
    - name: Install NSIS
      shell: pwsh
      run: |
        choco install nsis -y --no-progress
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        & "C:\Program Files (x86)\NSIS\makensis.exe" -VERSION
        
    - name: Build installer with NSIS
      shell: pwsh
      run: |
        cd installer
        & "C:\Program Files (x86)\NSIS\makensis.exe" u_one.nsi
        dir ..\Output\
        
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: U_One_Setup
        path: Output/U_One_Setup.exe
        
    - name: Upload portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: U_One_Portable
        path: Output/U_One_Portable.zip
